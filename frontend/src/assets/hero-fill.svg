<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.35" stop-color="#22d3ee"/>
      <stop offset="0.7" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="glowA" cx="30%" cy="35%" r="65%">
      <stop offset="0" stop-color="#e0faff" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#7dd3fc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="72%" cy="65%" r="70%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="90%" r="60%">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="1600" height="600" fill="url(#base)"/>

  <g filter="url(#blur)">
    <ellipse cx="480" cy="210" rx="720" ry="340" fill="url(#glowA)"/>
    <ellipse cx="1150" cy="380" rx="780" ry="360" fill="url(#glowB)"/>
    <ellipse cx="820" cy="520" rx="820" ry="300" fill="url(#glowC)"/>
  </g>

  <g opacity="0.35" filter="url(#blur)">
    <ellipse cx="780" cy="180" rx="880" ry="46" fill="url(#streak)"/>
    <ellipse cx="900" cy="330" rx="720" ry="30" fill="url(#streak)"/>
    <ellipse cx="560" cy="430" rx="760" ry="26" fill="url(#streak)"/>
  </g>
</svg>
